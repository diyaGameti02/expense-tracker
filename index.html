<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Smart Expense Tracker</h2>
        
        <!-- Balance Dashboard Card -->
        <div class="balance-card">
            <h4>Your Balance</h4>
            <h1 id="balance">₹0.00</h1>
            
            <div class="inc-exp-container">
                <div>
                    <h4>Income</h4>
                    <p id="money-plus" class="money plus">+₹0.00</p>
                </div>
                <div>
                    <h4>Expense</h4>
                    <p id="money-minus" class="money minus">-₹0.00</p>
                </div>
            </div>
        </div>

        <!-- History/Logs Section -->
        <h3>Transaction History</h3>
        <ul id="list" class="list">
            <!-- JavaScript will inject list items here dynamically -->
        </ul>

        <!-- Add Transaction Form -->
        <h3>Add New Transaction</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="Enter description (e.g., Groceries, Salary)..." required />
            </div>
            
            <div class="form-control">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" placeholder="Enter amount..." min="1" required />
            </div>

            <div class="form-control">
                <label for="type">Transaction Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <button class="btn">Add Transaction</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
